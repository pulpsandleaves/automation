<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand_name }} | WhatsApp Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='pulps.css') }}">
</head>
<body class="chat-body">
  {% if not authorized %}
    <main class="chat-login">
      <form class="chat-login__box" method="get" action="{{ url_for('chat_panel') }}">
        <p class="eyebrow">Operator panel</p>
        <h1>WhatsApp Chat</h1>
        {% if auth_error %}
          <div class="alert">{{ auth_error }}</div>
        {% endif %}
        <label>
          Access token
          <input name="token" type="password" autocomplete="current-password" autofocus>
        </label>
        <button type="submit">Open panel</button>
      </form>
    </main>
  {% else %}
    <main class="chat-shell" data-chat-app>
      <header class="chat-topbar">
        <div>
          <p class="eyebrow">Pulps operator</p>
          <h1>WhatsApp Chat</h1>
        </div>
        <span class="chat-status" data-sync-status>Syncing</span>
      </header>

      <section class="chat-workspace">
        <aside class="chat-sidebar">
          <div class="chat-sidebar__head">
            <h2>Chats</h2>
            <button class="icon-button" type="button" data-refresh title="Refresh">Refresh</button>
          </div>
          <input class="chat-search" data-contact-search placeholder="Search phone or name">
          <div class="contact-list" data-contact-list></div>
        </aside>

        <section class="chat-main">
          <div class="chat-thread-head">
            <div class="chat-thread-identity">
              <span class="chat-avatar" data-active-avatar>?</span>
              <div>
                <h2 data-active-name>No chat selected</h2>
                <p data-active-phone></p>
                <small data-window-detail></small>
              </div>
            </div>
            <span class="window-badge" data-window-badge></span>
          </div>

          <div class="message-list" data-message-list>
            <div class="empty">Select a customer chat.</div>
          </div>

          <form class="reply-form" data-reply-form enctype="multipart/form-data">
            <div class="image-compose" data-image-preview hidden></div>
            <textarea data-reply-message placeholder="Type a reply"></textarea>
            <input data-image-input type="file" accept="image/*" hidden>
            <button class="attach-button" type="button" data-image-button title="Attach image">Image</button>
            <button type="submit" data-send-button>Send</button>
          </form>
        </section>

        <aside class="template-panel">
          <h2>Template</h2>
          <form data-template-form>
            <label>
              Number
              <input data-template-phone inputmode="tel" placeholder="919835496666">
            </label>
            <label>
              Template
              <input data-template-name value="{{ default_template_name }}" required>
            </label>
            <label>
              Language
              <input data-template-language value="{{ default_template_language }}" required>
            </label>
            <label>
              Variables
              <textarea data-template-parameters placeholder="One value per line"></textarea>
            </label>
            <button type="submit">Send template</button>
          </form>
          <div class="chat-alert" data-chat-alert></div>
        </aside>
      </section>
    </main>

    <script>
      const token = {{ admin_token|tojson }};
      const state = {
        contacts: [],
        selectedPhone: "",
        messagesTimer: null,
      };

      const nodes = {
        syncStatus: document.querySelector("[data-sync-status]"),
        contactList: document.querySelector("[data-contact-list]"),
        contactSearch: document.querySelector("[data-contact-search]"),
        refresh: document.querySelector("[data-refresh]"),
        activeName: document.querySelector("[data-active-name]"),
        activePhone: document.querySelector("[data-active-phone]"),
        activeAvatar: document.querySelector("[data-active-avatar]"),
        windowDetail: document.querySelector("[data-window-detail]"),
        windowBadge: document.querySelector("[data-window-badge]"),
        messageList: document.querySelector("[data-message-list]"),
        replyForm: document.querySelector("[data-reply-form]"),
        replyMessage: document.querySelector("[data-reply-message]"),
        imageInput: document.querySelector("[data-image-input]"),
        imageButton: document.querySelector("[data-image-button]"),
        imagePreview: document.querySelector("[data-image-preview]"),
        sendButton: document.querySelector("[data-send-button]"),
        templateForm: document.querySelector("[data-template-form]"),
        templatePhone: document.querySelector("[data-template-phone]"),
        templateName: document.querySelector("[data-template-name]"),
        templateLanguage: document.querySelector("[data-template-language]"),
        templateParameters: document.querySelector("[data-template-parameters]"),
        alert: document.querySelector("[data-chat-alert]"),
      };

      function apiUrl(path, params = {}) {
        const url = new URL(path, window.location.origin);
        url.searchParams.set("token", token);
        Object.entries(params).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== "") {
            url.searchParams.set(key, value);
          }
        });
        return url;
      }

      function setStatus(text) {
        nodes.syncStatus.textContent = text;
      }

      function setAlert(text, type = "") {
        nodes.alert.textContent = text || "";
        nodes.alert.dataset.type = type;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function initials(value) {
        const text = String(value || "").trim();
        if (!text) return "?";
        const words = text.split(/\s+/).filter(Boolean);
        if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
        return text.slice(0, 2).toUpperCase();
      }

      function replySecondsRemaining(contact) {
        if (!contact) return 0;
        if (contact.reply_window_expires_at) {
          const expiresAt = new Date(contact.reply_window_expires_at);
          if (!Number.isNaN(expiresAt.getTime())) {
            return Math.max(0, Math.floor((expiresAt.getTime() - Date.now()) / 1000));
          }
        }
        return Math.max(0, Number(contact.reply_window_seconds_remaining || 0));
      }

      function isReplyOpen(contact) {
        return Boolean(contact && contact.within_reply_window && replySecondsRemaining(contact) > 0);
      }

      function formatDuration(seconds) {
        const totalMinutes = Math.max(0, Math.ceil(Number(seconds || 0) / 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours && minutes) return `${hours}h ${minutes}m`;
        if (hours) return `${hours}h`;
        return `${minutes || 0}m`;
      }

      function replyWindowLabel(contact) {
        if (!contact) return "";
        const seconds = replySecondsRemaining(contact);
        if (isReplyOpen(contact)) {
          return `${formatDuration(seconds)} left`;
        }
        if (contact.reply_window_expires_at) {
          return `Closed ${formatTime(contact.reply_window_expires_at)}`;
        }
        return "Template only";
      }

      function selectedContact() {
        return state.contacts.find((contact) => contact.phone === state.selectedPhone) || null;
      }

      function renderContacts() {
        const query = nodes.contactSearch.value.trim().toLowerCase();
        const contacts = state.contacts.filter((contact) => {
          return !query
            || String(contact.phone || "").includes(query)
            || String(contact.name || "").toLowerCase().includes(query)
            || String(contact.latest_order_id || "").toLowerCase().includes(query);
        });

        if (!contacts.length) {
          nodes.contactList.innerHTML = '<div class="empty">No chats yet.</div>';
          return;
        }

        nodes.contactList.innerHTML = contacts.map((contact) => {
          const active = contact.phone === state.selectedPhone ? "is-active" : "";
          const windowClass = isReplyOpen(contact) ? "open" : "closed";
          const title = contact.name || contact.phone;
          const orderLabel = contact.latest_order_id
            ? `${contact.latest_order_id}${contact.latest_order_status ? ` - ${contact.latest_order_status}` : ""}`
            : "";
          return `
            <button class="contact-item ${active}" type="button" data-phone="${escapeHtml(contact.phone)}">
              <span class="contact-avatar">${escapeHtml(initials(title))}</span>
              <span class="contact-item__main">
                <strong>${escapeHtml(title)}</strong>
                <small>${escapeHtml(contact.last_message_text || contact.last_message_type || "")}</small>
                ${orderLabel ? `<small class="contact-item__order">${escapeHtml(orderLabel)}</small>` : ""}
              </span>
              <span class="contact-item__meta">
                <small>${escapeHtml(formatTime(contact.last_message_at))}</small>
                <small>${escapeHtml(replyWindowLabel(contact))}</small>
                ${contact.source ? `<small>${escapeHtml(contact.source)}</small>` : ""}
                <span class="dot ${windowClass}"></span>
              </span>
            </button>
          `;
        }).join("");
      }

      function renderHeader(contact) {
        const title = contact ? (contact.name || contact.phone) : "No chat selected";
        nodes.activeName.textContent = title;
        nodes.activePhone.textContent = contact ? contact.phone : "";
        nodes.activeAvatar.textContent = contact ? initials(title) : "?";
        nodes.templatePhone.value = contact ? contact.phone : nodes.templatePhone.value;

        if (!contact) {
          nodes.windowBadge.textContent = "";
          nodes.windowDetail.textContent = "";
          nodes.replyMessage.disabled = true;
          nodes.imageButton.disabled = true;
          nodes.sendButton.disabled = true;
          return;
        }

        const open = isReplyOpen(contact);
        const label = replyWindowLabel(contact);
        nodes.windowBadge.textContent = open ? label : "Template only";
        nodes.windowDetail.textContent = open ? `Reply window closes in ${label}` : label;
        nodes.windowBadge.dataset.state = open ? "open" : "closed";
        nodes.replyMessage.disabled = !open;
        nodes.imageButton.disabled = !open;
        nodes.sendButton.disabled = !open;
        nodes.replyMessage.placeholder = open ? "Type a reply or image caption" : "Send a template to restart";
      }

      function renderMessages(messages) {
        if (!state.selectedPhone) {
          nodes.messageList.innerHTML = '<div class="empty">Select a customer chat.</div>';
          return;
        }
        if (!messages.length) {
          nodes.messageList.innerHTML = '<div class="empty">No saved messages yet.</div>';
          return;
        }

        nodes.messageList.innerHTML = messages.map((message) => {
          const direction = message.direction === "outbound" ? "outbound" : (message.direction === "system" ? "system" : "inbound");
          const isImage = message.message_type === "image";
          const mediaUrl = isImage && message.media_id
            ? apiUrl(`/api/admin/chat/media/${encodeURIComponent(message.media_id)}`)
            : "";
          const mediaBlock = mediaUrl
            ? `<figure class="message-media"><img src="${mediaUrl}" alt="${escapeHtml(message.media_filename || "WhatsApp image")}" loading="lazy"><figcaption>${escapeHtml(message.media_filename || "Image")}</figcaption></figure>`
            : "";
          return `
            <article class="message-bubble ${direction}">
              ${mediaBlock}
              ${message.message_text ? `<p>${escapeHtml(message.message_text).replace(/\n/g, "<br>")}</p>` : ""}
              <footer>
                <span>${escapeHtml(formatTime(message.timestamp))}</span>
                ${message.template_name ? `<span>${escapeHtml(message.template_name)}</span>` : ""}
                ${message.status ? `<span>${escapeHtml(message.status)}</span>` : ""}
              </footer>
            </article>
          `;
        }).join("");
        nodes.messageList.scrollTop = nodes.messageList.scrollHeight;
      }

      async function loadContacts({ keepSelection = true } = {}) {
        setStatus("Syncing");
        const response = await fetch(apiUrl("/api/admin/chat/contacts"));
        if (!response.ok) throw new Error("Could not load contacts");
        const data = await response.json();
        state.contacts = data.contacts || [];
        if (!keepSelection || !state.selectedPhone || !state.contacts.some((contact) => contact.phone === state.selectedPhone)) {
          state.selectedPhone = state.contacts[0]?.phone || "";
        }
        renderContacts();
        renderHeader(selectedContact());
        setStatus(data.stale ? "Cached" : "Live");
      }

      async function loadMessages() {
        if (!state.selectedPhone) {
          renderMessages([]);
          return;
        }
        const response = await fetch(apiUrl("/api/admin/chat/messages", { phone: state.selectedPhone }));
        if (!response.ok) throw new Error("Could not load messages");
        const data = await response.json();
        if (data.stale) setStatus("Cached");
        if (data.contact) {
          const index = state.contacts.findIndex((contact) => contact.phone === data.contact.phone);
          if (index >= 0) state.contacts[index] = data.contact;
        }
        renderHeader(selectedContact());
        renderMessages(data.messages || []);
      }

      async function refreshAll() {
        try {
          await loadContacts();
          await loadMessages();
          setAlert("");
        } catch (error) {
          setStatus("Paused");
          setAlert(error.message, "error");
        }
      }

      nodes.contactList.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-phone]");
        if (!button) return;
        state.selectedPhone = button.dataset.phone;
        renderContacts();
        renderHeader(selectedContact());
        await loadMessages();
      });

      nodes.contactSearch.addEventListener("input", renderContacts);
      nodes.refresh.addEventListener("click", refreshAll);

      nodes.replyForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = nodes.replyMessage.value.trim();
        const imageFile = nodes.imageInput.files[0];
        if (!state.selectedPhone || (!message && !imageFile)) return;
        setAlert("");
        let response;
        if (imageFile) {
          const formData = new FormData();
          formData.append("token", token);
          formData.append("phone", state.selectedPhone);
          formData.append("caption", message);
          formData.append("agent", "Admin");
          formData.append("image", imageFile);
          response = await fetch("/api/admin/chat/image", { method: "POST", body: formData });
        } else {
          response = await fetch("/api/admin/chat/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, phone: state.selectedPhone, message, agent: "Admin" }),
          });
        }
        const data = await response.json();
        if (!response.ok) {
          setAlert(data.error || "Reply failed", "error");
          return;
        }
        nodes.replyMessage.value = "";
        nodes.imageInput.value = "";
        renderImagePreview();
        await loadMessages();
      });

      function renderImagePreview() {
        const imageFile = nodes.imageInput.files[0];
        if (!imageFile) {
          nodes.imagePreview.hidden = true;
          nodes.imagePreview.textContent = "";
          nodes.sendButton.textContent = "Send";
          return;
        }
        nodes.imagePreview.hidden = false;
        nodes.imagePreview.innerHTML = `
          <span>${escapeHtml(imageFile.name)}</span>
          <button type="button" data-clear-image>Remove</button>
        `;
        nodes.sendButton.textContent = "Send image";
      }

      nodes.imageButton.addEventListener("click", () => nodes.imageInput.click());
      nodes.imageInput.addEventListener("change", renderImagePreview);
      nodes.imagePreview.addEventListener("click", (event) => {
        if (!event.target.closest("[data-clear-image]")) return;
        nodes.imageInput.value = "";
        renderImagePreview();
      });

      nodes.templateForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const phone = nodes.templatePhone.value.trim();
        const templateName = nodes.templateName.value.trim();
        const languageCode = nodes.templateLanguage.value.trim();
        const templateParameters = nodes.templateParameters.value;
        if (!phone || !templateName || !languageCode) return;
        setAlert("");
        const response = await fetch("/api/admin/chat/template", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            phone,
            template_name: templateName,
            language_code: languageCode,
            template_parameters: templateParameters,
            agent: "Admin",
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          setAlert(data.error || "Template failed", "error");
          return;
        }
        setAlert("Template sent", "success");
        if (phone === state.selectedPhone) await loadMessages();
      });

      refreshAll();
      window.setInterval(refreshAll, 12000);
      window.setInterval(() => {
        renderContacts();
        renderHeader(selectedContact());
      }, 30000);
    </script>
  {% endif %}
</body>
</html>
