<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand_name }} | Support HQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='pulps.css') }}">
</head>
<body class="chat-body">
  {% if not authorized %}
    <main class="chat-login">
      <form class="chat-login__box" method="get" action="{{ url_for('chat_panel') }}">
        <p class="eyebrow">Operator panel</p>
        <h1>Support HQ</h1>
        {% if auth_error %}
          <div class="alert">{{ auth_error }}</div>
        {% endif %}
        <label>
          Access token
          <input name="token" type="password" autocomplete="current-password" autofocus>
        </label>
        <button type="submit">Open panel</button>
      </form>
    </main>
  {% else %}
    <main class="support-hq" data-chat-app data-mobile-view="inbox">
      <nav class="mobile-view-tabs" data-mobile-tabs aria-label="Operator views">
        <button class="is-active" type="button" data-mobile-view-button="inbox">Inbox</button>
        <button type="button" data-mobile-view-button="thread">Chat</button>
        <button type="button" data-mobile-view-button="tools">Template</button>
      </nav>

      <section class="hq-inbox" aria-label="Active chats">
        <header class="hq-inbox__header">
          <div>
            <p class="section-kicker">Support HQ</p>
            <h1>Inbox</h1>
          </div>
          <span class="open-pill" data-sync-status>Syncing</span>
        </header>

        <label class="hq-search">
          <span aria-hidden="true">⌕</span>
          <input data-contact-search placeholder="Search customers...">
        </label>

        <div class="contact-list hq-contact-list" data-contact-list></div>
      </section>

      <section class="hq-thread" aria-label="Conversation">
        <header class="hq-thread__header">
          <div class="chat-thread-identity">
            <span class="chat-avatar hq-avatar" data-active-avatar>?</span>
            <div>
              <h2 data-active-name>No chat selected</h2>
              <p data-active-phone></p>
              <small data-window-detail></small>
            </div>
          </div>
          <div class="hq-thread__actions">
            <span class="window-badge" data-window-badge></span>
            <button class="thread-icon-button" type="button" data-refresh aria-label="Refresh chat" title="Refresh chat">↻</button>
          </div>
        </header>

        <div class="message-list hq-message-list" data-message-list>
          <div class="empty">Select a customer chat.</div>
        </div>

        <form class="reply-form hq-reply" data-reply-form enctype="multipart/form-data">
          <div class="media-compose" data-media-preview hidden></div>
          <button class="compose-icon-button" type="button" data-media-button title="Attach image or PDF">+</button>
          <textarea data-reply-message placeholder="Type a message..."></textarea>
          <label class="reply-handoff" title="If enabled, the next customer reply will go to the automated bot instead of staying muted for human chat.">
            <input data-reply-bot-handoff type="checkbox">
            Bot handles next reply
          </label>
          <input data-media-input type="file" accept="image/*,application/pdf" hidden>
          <button class="compose-icon-button compose-icon-button--send" type="submit" data-send-button title="Send">▷</button>
        </form>
      </section>

      <aside class="hq-tools" aria-label="Send template">
        <header class="hq-tools__header">
          <h2>Send Template</h2>
        </header>

        <section class="tool-card">
          <form class="template-form" data-template-form>
            <label>
              Target Phone
              <input data-template-phone inputmode="tel" placeholder="919835496666">
            </label>
            <label>
              Select Template
              <input data-template-name list="template-options" value="{{ default_template_name }}" required>
              <datalist id="template-options">
                <option value="{{ default_template_name }}"></option>
                <option value="order_confirmation"></option>
                <option value="say_hi"></option>
              </datalist>
            </label>
            <label>
              Language
              <input data-template-language value="{{ default_template_language }}" required>
            </label>
            <label>
              Template Variables
              <textarea data-template-parameters placeholder="{{ '{{name}}' }}, {{ '{{product}}' }}"></textarea>
            </label>
            <small>Use one value per line for dynamic fields.</small>
            <button class="send-template-button" type="submit">
              <span aria-hidden="true">✦</span>
              Send Template
            </button>
          </form>
          <div class="chat-alert" data-chat-alert></div>
        </section>
      </aside>
    </main>

    <script>
      const token = {{ admin_token|tojson }};
      const supabaseChatEnabled = {{ supabase_chat_enabled|tojson }};
      const messagePollMs = supabaseChatEnabled ? 5000 : 30000;
      const contactPollMs = supabaseChatEnabled ? 10000 : 60000;
      const state = {
        contacts: [],
        selectedPhone: "",
      };

      const nodes = {
        app: document.querySelector("[data-chat-app]"),
        mobileViewButtons: document.querySelectorAll("[data-mobile-view-button]"),
        syncStatus: document.querySelector("[data-sync-status]"),
        contactList: document.querySelector("[data-contact-list]"),
        contactSearch: document.querySelector("[data-contact-search]"),
        refreshButtons: document.querySelectorAll("[data-refresh]"),
        activeName: document.querySelector("[data-active-name]"),
        activePhone: document.querySelector("[data-active-phone]"),
        activeAvatar: document.querySelector("[data-active-avatar]"),
        windowDetail: document.querySelector("[data-window-detail]"),
        windowBadge: document.querySelector("[data-window-badge]"),
        messageList: document.querySelector("[data-message-list]"),
        replyForm: document.querySelector("[data-reply-form]"),
        replyMessage: document.querySelector("[data-reply-message]"),
        replyBotHandoff: document.querySelector("[data-reply-bot-handoff]"),
        mediaInput: document.querySelector("[data-media-input]"),
        mediaButton: document.querySelector("[data-media-button]"),
        mediaPreview: document.querySelector("[data-media-preview]"),
        sendButton: document.querySelector("[data-send-button]"),
        templateForm: document.querySelector("[data-template-form]"),
        templatePhone: document.querySelector("[data-template-phone]"),
        templateName: document.querySelector("[data-template-name]"),
        templateLanguage: document.querySelector("[data-template-language]"),
        templateParameters: document.querySelector("[data-template-parameters]"),
        alert: document.querySelector("[data-chat-alert]"),
      };

      function apiUrl(path, params = {}) {
        const url = new URL(path, window.location.origin);
        url.searchParams.set("token", token);
        Object.entries(params).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== "") {
            url.searchParams.set(key, value);
          }
        });
        return url;
      }

      function setStatus(text) {
        nodes.syncStatus.textContent = text;
      }

      function setAlert(text, type = "") {
        nodes.alert.textContent = text || "";
        nodes.alert.dataset.type = type;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function shortTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function initials(value) {
        const text = String(value || "").trim();
        if (!text) return "?";
        const words = text.split(/\s+/).filter(Boolean);
        if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
        return text.slice(0, 2).toUpperCase();
      }

      function replySecondsRemaining(contact) {
        if (!contact) return 0;
        if (contact.reply_window_expires_at) {
          const expiresAt = new Date(contact.reply_window_expires_at);
          if (!Number.isNaN(expiresAt.getTime())) {
            return Math.max(0, Math.floor((expiresAt.getTime() - Date.now()) / 1000));
          }
        }
        return Math.max(0, Number(contact.reply_window_seconds_remaining || 0));
      }

      function isReplyOpen(contact) {
        return Boolean(contact && contact.within_reply_window && replySecondsRemaining(contact) > 0);
      }

      function formatDuration(seconds) {
        const totalMinutes = Math.max(0, Math.ceil(Number(seconds || 0) / 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours && minutes) return `${hours}h ${minutes}m`;
        if (hours) return `${hours}h`;
        return `${minutes || 0}m`;
      }

      function replyWindowLabel(contact) {
        if (!contact) return "";
        const seconds = replySecondsRemaining(contact);
        if (isReplyOpen(contact)) {
          return `${formatDuration(seconds)} left`;
        }
        if (contact.reply_window_expires_at) {
          return `Closed ${formatTime(contact.reply_window_expires_at)}`;
        }
        return "Template only";
      }

      function selectedContact() {
        return state.contacts.find((contact) => contact.phone === state.selectedPhone) || null;
      }

      function setMobileView(view) {
        nodes.app.dataset.mobileView = view;
        nodes.mobileViewButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.mobileViewButton === view);
        });
      }

      function renderContacts() {
        const query = nodes.contactSearch.value.trim().toLowerCase();
        const contacts = state.contacts.filter((contact) => {
          return !query
            || String(contact.phone || "").includes(query)
            || String(contact.name || "").toLowerCase().includes(query)
            || String(contact.latest_order_id || "").toLowerCase().includes(query);
        });

        const openCount = state.contacts.filter(isReplyOpen).length;
        nodes.syncStatus.textContent = `${openCount} Open`;

        if (!contacts.length) {
          nodes.contactList.innerHTML = '<div class="empty">No chats yet.</div>';
          return;
        }

        nodes.contactList.innerHTML = contacts.map((contact) => {
          const active = contact.phone === state.selectedPhone ? "is-active" : "";
          const windowClass = isReplyOpen(contact) ? "open" : "closed";
          const title = contact.name || contact.phone;
          const orderLabel = contact.latest_order_id
            ? `${contact.latest_order_id}${contact.latest_order_status ? ` - ${contact.latest_order_status}` : ""}`
            : replyWindowLabel(contact);
          return `
            <button class="contact-item ${active}" type="button" data-phone="${escapeHtml(contact.phone)}">
              <span class="contact-avatar">${escapeHtml(initials(title))}</span>
              <span class="contact-item__main">
                <strong>${escapeHtml(title)}</strong>
                <small>${escapeHtml(contact.last_message_text || contact.last_message_type || "No preview yet")}</small>
                <span class="contact-window ${windowClass}">◷ ${escapeHtml(orderLabel)}</span>
              </span>
              <span class="contact-item__meta">
                <small>${escapeHtml(shortTime(contact.last_message_at) || "Now")}</small>
                <span class="dot ${windowClass}"></span>
              </span>
            </button>
          `;
        }).join("");
      }

      function renderHeader(contact) {
        const title = contact ? (contact.name || contact.phone) : "No chat selected";
        nodes.activeName.textContent = title;
        nodes.activePhone.textContent = contact ? contact.phone : "";
        nodes.activeAvatar.textContent = contact ? initials(title) : "?";
        nodes.templatePhone.value = contact ? contact.phone : nodes.templatePhone.value;

        if (!contact) {
          nodes.windowBadge.textContent = "";
          nodes.windowDetail.textContent = "";
          nodes.replyMessage.disabled = true;
          nodes.mediaButton.disabled = true;
          nodes.sendButton.disabled = true;
          return;
        }

        const open = isReplyOpen(contact);
        const label = replyWindowLabel(contact);
        nodes.windowBadge.textContent = open ? label : "Template only";
        nodes.windowDetail.textContent = open ? `Reply window closes in ${label}` : label;
        nodes.windowBadge.dataset.state = open ? "open" : "closed";
        nodes.replyMessage.disabled = !open;
        nodes.mediaButton.disabled = !open;
        nodes.sendButton.disabled = !open;
        nodes.replyMessage.placeholder = open ? "Type a message..." : "Send a template to restart";
      }

      function renderMessagesLoading() {
        nodes.messageList.innerHTML = `
          <div class="message-loading" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading conversation</span>
          </div>
        `;
      }

      function renderMessages(messages) {
        if (!state.selectedPhone) {
          nodes.messageList.innerHTML = '<div class="empty">Select a customer chat.</div>';
          return;
        }
        if (!messages.length) {
          nodes.messageList.innerHTML = '<div class="empty">No saved messages yet.</div>';
          return;
        }

        const messageHtml = messages.map((message) => {
          const direction = message.direction === "outbound" ? "outbound" : (message.direction === "system" ? "system" : "inbound");
          const mimeType = String(message.media_mime_type || "").toLowerCase();
          const filename = message.media_filename || (message.message_type === "document" ? "Document.pdf" : "WhatsApp image");
          const isImage = message.message_type === "image" && message.media_id;
          const isPdf = message.message_type === "document"
            && message.media_id
            && (mimeType === "application/pdf" || String(filename).toLowerCase().endsWith(".pdf"));
          const mediaUrl = (isImage || isPdf)
            ? apiUrl(`/api/admin/chat/media/${encodeURIComponent(message.media_id)}`, { name: filename })
            : "";
          const mediaBlock = isImage
            ? `<figure class="message-media"><img src="${mediaUrl}" alt="${escapeHtml(filename)}" loading="lazy"><figcaption>${escapeHtml(filename)}</figcaption></figure>`
            : (isPdf
              ? `<a class="document-attachment" href="${mediaUrl}" target="_blank" rel="noopener">
                  <span class="document-attachment__icon">PDF</span>
                  <span><strong>${escapeHtml(filename)}</strong><small>Open document</small></span>
                </a>`
              : "");
          return `
            <article class="message-bubble ${direction}">
              ${mediaBlock}
              ${message.template_name ? `<p class="template-chip">✦ Template: ${escapeHtml(message.template_name)}</p>` : ""}
              ${message.message_text ? `<p>${escapeHtml(message.message_text).replace(/\n/g, "<br>")}</p>` : ""}
              <footer>
                <span>${escapeHtml(shortTime(message.timestamp) || formatTime(message.timestamp))}</span>
                ${message.status ? `<span>${escapeHtml(message.status)}</span>` : ""}
              </footer>
            </article>
          `;
        }).join("");

        nodes.messageList.innerHTML = messageHtml;
        nodes.messageList.scrollTop = nodes.messageList.scrollHeight;
      }

      async function loadContacts({ keepSelection = true } = {}) {
        setStatus("Syncing");
        const response = await fetch(apiUrl("/api/admin/chat/contacts"));
        if (!response.ok) throw new Error("Could not load contacts");
        const data = await response.json();
        state.contacts = data.contacts || [];
        if (!keepSelection || !state.selectedPhone || !state.contacts.some((contact) => contact.phone === state.selectedPhone)) {
          state.selectedPhone = state.contacts[0]?.phone || "";
        }
        renderContacts();
        renderHeader(selectedContact());
        if (data.stale) setStatus("Cached");
      }

      async function loadMessages({ showLoading = false } = {}) {
        const phone = state.selectedPhone;
        if (!phone) {
          renderMessages([]);
          return;
        }
        if (showLoading) renderMessagesLoading();
        const response = await fetch(apiUrl("/api/admin/chat/messages", { phone }));
        if (!response.ok) throw new Error("Could not load messages");
        const data = await response.json();
        if (phone !== state.selectedPhone) return;
        if (data.stale) setStatus("Cached");
        if (data.contact) {
          const index = state.contacts.findIndex((contact) => contact.phone === data.contact.phone);
          if (index >= 0) state.contacts[index] = data.contact;
        }
        renderHeader(selectedContact());
        renderMessages(data.messages || []);
      }

      async function refreshAll() {
        try {
          await loadContacts();
          await loadMessages();
          setAlert("");
        } catch (error) {
          setStatus("Paused");
          setAlert(error.message, "error");
        }
      }

      nodes.contactList.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-phone]");
        if (!button) return;
        state.selectedPhone = button.dataset.phone;
        renderContacts();
        renderHeader(selectedContact());
        setMobileView("thread");
        try {
          await loadMessages({ showLoading: true });
        } catch (error) {
          nodes.messageList.innerHTML = '<div class="empty">Could not load this conversation.</div>';
          setAlert(error.message, "error");
        }
      });

      nodes.contactSearch.addEventListener("input", renderContacts);
      nodes.refreshButtons.forEach((button) => button.addEventListener("click", refreshAll));
      nodes.mobileViewButtons.forEach((button) => {
        button.addEventListener("click", () => setMobileView(button.dataset.mobileViewButton));
      });

      nodes.replyForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = nodes.replyMessage.value.trim();
        const mediaFile = nodes.mediaInput.files[0];
        const botHandoff = nodes.replyBotHandoff.checked;
        if (!state.selectedPhone || (!message && !mediaFile)) return;
        setAlert("");
        let response;
        if (mediaFile) {
          const formData = new FormData();
          formData.append("token", token);
          formData.append("phone", state.selectedPhone);
          formData.append("caption", message);
          formData.append("agent", "Admin");
          formData.append("bot_handoff", botHandoff ? "true" : "false");
          formData.append("media", mediaFile);
          response = await fetch("/api/admin/chat/media", { method: "POST", body: formData });
        } else {
          response = await fetch("/api/admin/chat/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, phone: state.selectedPhone, message, agent: "Admin", bot_handoff: botHandoff }),
          });
        }
        const data = await response.json();
        if (!response.ok) {
          setAlert(data.error || "Reply failed", "error");
          return;
        }
        nodes.replyMessage.value = "";
        nodes.replyBotHandoff.checked = false;
        nodes.mediaInput.value = "";
        renderMediaPreview();
        await loadMessages();
      });

      function renderMediaPreview() {
        const mediaFile = nodes.mediaInput.files[0];
        if (!mediaFile) {
          nodes.mediaPreview.hidden = true;
          nodes.mediaPreview.textContent = "";
          nodes.sendButton.textContent = "▷";
          return;
        }
        const kind = mediaFile.type === "application/pdf" ? "PDF" : "Image";
        nodes.mediaPreview.hidden = false;
        nodes.mediaPreview.innerHTML = `
          <span><strong>${kind}</strong> · ${escapeHtml(mediaFile.name)}</span>
          <button type="button" data-clear-media>Remove</button>
        `;
        nodes.sendButton.textContent = "➤";
      }

      nodes.mediaButton.addEventListener("click", () => nodes.mediaInput.click());
      nodes.mediaInput.addEventListener("change", renderMediaPreview);
      nodes.mediaPreview.addEventListener("click", (event) => {
        if (!event.target.closest("[data-clear-media]")) return;
        nodes.mediaInput.value = "";
        renderMediaPreview();
      });

      nodes.templateForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const phone = nodes.templatePhone.value.trim();
        const templateName = nodes.templateName.value.trim();
        const languageCode = nodes.templateLanguage.value.trim();
        const templateParameters = nodes.templateParameters.value;
        if (!phone || !templateName || !languageCode) return;
        setAlert("");
        const response = await fetch("/api/admin/chat/template", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            phone,
            template_name: templateName,
            language_code: languageCode,
            template_parameters: templateParameters,
            agent: "Admin",
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          setAlert(data.error || "Template failed", "error");
          return;
        }
        setAlert("Template sent", "success");
        if (phone === state.selectedPhone) await loadMessages();
      });

      refreshAll();
      window.setInterval(() => {
        loadMessages().catch((error) => setAlert(error.message, "error"));
      }, messagePollMs);
      window.setInterval(() => {
        loadContacts().catch((error) => {
          setStatus("Paused");
          setAlert(error.message, "error");
        });
      }, contactPollMs);
      window.setInterval(() => {
        renderContacts();
        renderHeader(selectedContact());
      }, 30000);
    </script>
  {% endif %}
</body>
</html>
