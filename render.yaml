services:
  - type: web
    name: pulps-and-leaves-whatsapp-automation
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LOG_LEVEL
        value: INFO
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v19.0
      - key: GOOGLE_SHEET_NAME
        value: PulpsAndLeavesOrders
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_WORKSHEET_NAME
        value: orders
      - key: ECOMMERCE_ORDERS_WORKSHEET_NAME
        value: orders
      - key: GOOGLE_DAILY_WORKSHEET_PREFIX
        value: orders
      - key: WHATSAPP_CONTACTS_WORKSHEET_NAME
        value: WhatsApp Contacts
      - key: GOOGLE_CONVERSATION_LOGGING_ENABLED
        value: "false"
      - key: SUPABASE_CHAT_ENABLED
        value: "true"
      - key: SUPABASE_URL
        value: https://hotvabriczbokrcpvmzo.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_CONTACTS_TABLE
        value: whatsapp_contacts
      - key: SUPABASE_MESSAGES_TABLE
        value: whatsapp_messages
      - key: SUPABASE_CHAT_CONTACT_CACHE_SECONDS
        value: "5"
      - key: SUPABASE_CHAT_MESSAGE_CACHE_SECONDS
        value: "3"
      - key: SUPABASE_CHAT_CONTACT_BACKFILL_SECONDS
        value: "900"
      - key: GOOGLE_CHAT_SUMMARY_QUEUE_MAX_SIZE
        value: "500"
      - key: CHAT_CONTACT_CACHE_SECONDS
        value: "60"
      - key: CHAT_MESSAGE_CACHE_SECONDS
        value: "15"
      - key: HUMAN_CHAT_IDLE_MINUTES
        value: "1440"
      - key: AUTO_CONFIRMATIONS_INTERVAL_SECONDS
        value: "300"
      - key: SHEETS_RATE_LIMIT_BACKOFF_SECONDS
        value: "300"
      - key: AUTO_CONFIRMATION_BATCH_LIMIT
        value: "3"
      - key: WEBHOOK_QUEUE_MAX_SIZE
        value: "200"
      - key: OPERATOR_MEDIA_UPLOAD_MAX_BYTES
        value: "16777216"
      - key: ORDER_CHAT_CACHE_SECONDS
        value: "300"
      - key: LOCAL_TIMEZONE
        value: Asia/Kolkata
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: ORDER_SQLITE_PATH
        value: /tmp/pulps_orders.db
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: ORDER_CONFIRMATION_TEMPLATE_NAME
        value: order_confirmation
      - key: ORDER_CONFIRMATION_TEMPLATE_LANGUAGE
        value: en
      - key: OFFLINE_ORDER_TEMPLATE_NAME
        value: offline_orders
      - key: OFFLINE_ORDER_TEMPLATE_LANGUAGE
